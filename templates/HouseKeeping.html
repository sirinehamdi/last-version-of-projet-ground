        .form-check-input {
            background-color: #ccc;

        .hk-parameters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 18px;
        }

        .hk-parameter-card {
            --parameter-accent: #177dff;
            min-height: 178px;
            margin: 0;
            overflow: hidden;
            border: 1px solid #e6edf5;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(31, 41, 55, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .hk-parameter-card:hover {
            box-shadow: 0 12px 26px rgba(31, 41, 55, 0.14);
            transform: translateY(-3px);
        }

        .hk-parameter-card::before {
            display: block;
            width: 100%;
            height: 5px;
            background: var(--parameter-accent);
            content: "";
        }

        .hk-parameter-card .card-body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 173px;
            padding: 17px 18px 16px;
        }

        .hk-parameter-header,
        .hk-parameter-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .hk-live-indicator {
            color: #7b8794;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0;
        }

        .hk-live-indicator::before {
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 5px;
            border-radius: 50%;
            background: #2fb344;
            content: "";
        }

        .hk-parameter-name {
            margin: 0;
            color: #6b7280;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0;
            overflow-wrap: anywhere;
            text-transform: uppercase;
        }

        .hk-parameter-value {
            margin: 12px 0;
            color: #202b3c;
            font-size: 30px;
            font-weight: 700;
            line-height: 1.15;
            overflow-wrap: anywhere;
        }

        .hk-parameter-footer {
            color: #8b96a5;
            font-size: 11px;
            font-weight: 600;
        }

        .hk-empty-state {
            grid-column: 1 / -1;
            margin: 0;
            color: #6b7280;
        }

        .hk-charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
            gap: 18px;
        }

        .hk-chart-card {
            margin: 0;
            border-radius: 8px;
        }

        .hk-chart-card .card-header {

        }

        .hk-chart-container {
            height: 375px;
        }

        .hk-chart-filter {

            margin-left: auto;

            border-radius: 6px;
            background: #f8fafc;
            color: #263445;

            border-color: #177dff;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(23, 125, 255, 0.14);
        }

                margin-left: 0;
                width: 100%;
            }

            <script>






           

                document.getElementById("satelliteSelect").addEventListener("change", async function () {
                    const response = await fetch("/satellite/switch", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ satellite: this.value })
                    });
                    const data = await response.json();

                    if (response.ok) {
                        addTerminalLine("PROFIL", data.message, "ACTIF");
                    } else {
                        addTerminalLine("PROFIL", data.error || "Erreur", "ECHEC");
                    }
                });

                const parametersGrid = document.getElementById("hkParametersGrid");
                const chartsGrid = document.getElementById("hkChartsGrid");
                const chartFilter = document.getElementById("hkChartFilter");
                const automaticCharts = new Map();
                let chartsLibraryReady = false;
                let latestTelemetryData = null;

                function formatParameterValue(value) {
                    if (value === null || value === undefined || value === "") {
                        return "--";
                    }

                    if (typeof value === "number") {
                        return Number.isInteger(value) ? String(value) : value.toFixed(2);
                    }

                    return String(value);
                }

                function getParameterPresentation(name) {
                    const normalizedName = name.toLowerCase();

                    if (normalizedName.includes("temp")) {
                        return { accent: "#e55353" };
                    }
                    if (normalizedName.includes("bat") || normalizedName.includes("volt")) {
                        return { accent: "#f59f00" };
                    }
                    if (normalizedName.includes("current") || normalizedName.includes("courant")) {
                        return { accent: "#7048e8" };
                    }
                    if (normalizedName.includes("status") || normalizedName.includes("state")) {
                        return { accent: "#2fb344" };
                    }
                    if (normalizedName.includes("press")) {
                        return { accent: "#1098ad" };
                    }

                    return { accent: "#177dff" };
                }

                function isAutomaticChartParameter(name, values) {
                    return name.toLowerCase() !== "time"
                        && Array.isArray(values)
                        && values.some((value) => Number.isFinite(Number(value)));
                }

                function getSelectedChartParameters() {
                    const filterValue = chartFilter.value.trim().toLowerCase();
                    if (!filterValue || filterValue === "all") return null;

                    return new Set(
                        filterValue.split(/[;,]/)
                            .map((name) => name.trim())
                            .filter(Boolean)
                    );
                }

                function createAutomaticChart(name) {
                    const presentation = getParameterPresentation(name);
                    const chartCard = document.createElement("article");
                    const cardHeader = document.createElement("div");
                    const chartTitle = document.createElement("div");
                    const cardBody = document.createElement("div");
                    const chartContainer = document.createElement("div");
                    const canvas = document.createElement("canvas");

                    chartCard.className = "card hk-chart-card";
                    cardHeader.className = "card-header";
                    chartTitle.className = "card-title";
                    cardBody.className = "card-body";
                    chartContainer.className = "hk-chart-container";
                    chartTitle.textContent = name;

                    chartContainer.appendChild(canvas);
                    cardHeader.appendChild(chartTitle);
                    cardBody.appendChild(chartContainer);
                    chartCard.append(cardHeader, cardBody);
                    chartsGrid.appendChild(chartCard);

                    const chart = new Chart(canvas.getContext("2d"), {
                        type: "line",
                        data: {
                            labels: [],
                            datasets: [{
                                label: name,
                                data: [],
                                borderColor: presentation.accent,
                                borderWidth: 2,
                                fill: false,
                                pointRadius: 0,
                                tension: 0.3
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { ticks: { maxTicksLimit: 5 } },
                                y: { beginAtZero: false }
                            }
                        }
                    });

                    automaticCharts.set(name, { chart, chartCard });
                    return chart;
                }

                function renderAutomaticCharts(data) {
                    if (!chartsLibraryReady || !window.Chart) return;

                    const timeValues = Array.isArray(data?.time) ? data.time : [];
                    const selectedParameters = getSelectedChartParameters();
                    const chartParameterNames = Object.keys(data || {}).filter((name) =>
                        isAutomaticChartParameter(name, data[name])
                        && (!selectedParameters || selectedParameters.has(name.toLowerCase()))
                    );

                    automaticCharts.forEach(({ chart, chartCard }, name) => {
                        if (!chartParameterNames.includes(name)) {
                            chart.destroy();
                            chartCard.remove();
                            automaticCharts.delete(name);
                        }
                    });

                    if (!chartParameterNames.length) {
                        if (!chartsGrid.children.length) {
                            chartsGrid.innerHTML = '<p class="hk-empty-state">Les graphiques apparaitront automatiquement a la reception des parametres.</p>';
                        }
                        return;
                    }

                    const emptyState = chartsGrid.querySelector(".hk-empty-state");
                    if (emptyState) emptyState.remove();

                    chartParameterNames.sort().forEach((name) => {
                        const numericValues = data[name]
                            .map(Number)
                            .filter((value) => Number.isFinite(value))
                            .slice(-20);
                        const chart = automaticCharts.get(name)?.chart || createAutomaticChart(name);

                        chart.data.labels = timeValues.slice(-numericValues.length);
                        chart.data.datasets[0].data = numericValues;
                        chart.update();
                    });
                }

                function renderParameters(data) {
                    const parameterNames = Object.keys(data || {}).filter((name) => name.toLowerCase() !== "time");
                    parametersGrid.replaceChildren();

                    if (!parameterNames.length) {
                        const emptyState = document.createElement("p");
                        emptyState.className = "hk-empty-state";
                        emptyState.textContent = "En attente des donnees de telemetrie.";
                        parametersGrid.appendChild(emptyState);
                        return;
                    }

                    parameterNames.sort().forEach((name) => {
                        const values = Array.isArray(data[name]) ? data[name] : [];
                        const latestValue = values.length ? values[values.length - 1] : null;
                        const presentation = getParameterPresentation(name);
                        const parameterCard = document.createElement("article");
                        const cardBody = document.createElement("div");
                        const header = document.createElement("div");
                        const liveIndicator = document.createElement("span");
                        const parameterName = document.createElement("p");
                        const parameterValue = document.createElement("p");
                        const footer = document.createElement("div");
                        const footerLabel = document.createElement("span");

                        parameterCard.className = "card hk-parameter-card";
                        cardBody.className = "card-body";
                        header.className = "hk-parameter-header";
                        liveIndicator.className = "hk-live-indicator";
                        parameterName.className = "hk-parameter-name";
                        parameterValue.className = "hk-parameter-value";
                        footer.className = "hk-parameter-footer";
                        parameterCard.style.setProperty("--parameter-accent", presentation.accent);
                        liveIndicator.textContent = "LIVE";
                        parameterName.textContent = name;
                        parameterValue.textContent = formatParameterValue(latestValue);
                        footerLabel.textContent = "Derniere mesure";

                        header.appendChild(liveIndicator);
                        footer.appendChild(footerLabel);
                        cardBody.append(header, parameterName, parameterValue, footer);
                        parameterCard.appendChild(cardBody);
                        parametersGrid.appendChild(parameterCard);
                    });
                }

                async function updateParameters() {
                    try {
                        const response = await fetch("/data");
                        if (!response.ok) return;
                        const data = await response.json();
                        latestTelemetryData = data;
                        renderParameters(data);
                        renderAutomaticCharts(data);
                    } catch (error) {
                        console.warn("Parameters update failed:", error);
                    }
                }

                window.addEventListener("load", () => {
                    chartsLibraryReady = true;
                    updateParameters();
                });
                chartFilter.addEventListener("change", () => renderAutomaticCharts(latestTelemetryData));
                chartFilter.addEventListener("keydown", (event) => {
                    if (event.key === "Enter") {
                        event.preventDefault();
                        renderAutomaticCharts(latestTelemetryData);
                    }
                });
                updateParameters();
                setInterval(updateParameters, 1000);

            </script>
