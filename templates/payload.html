    <script>
        let cameraToggle = null;

        setInterval(checkCameraState, 1000);

        window.addEventListener("DOMContentLoaded", () => {
            loadCameraToggle().then(checkCameraState);
        });

        async function loadCameraToggle() {
            try {
                const response = await fetch("/commands");
                const data = await response.json();
                cameraToggle = (data.commands || []).find(
                    command => command.feature === "camera"
                ) || null;
            } catch (error) {
                console.log("Erreur chargement commande video :", error);
            }
        }

        function checkCameraState() {
            if (!cameraToggle) {
                return;
            }

            fetch(`/command_state/${encodeURIComponent(cameraToggle.on_id)}`)
                .then(response => response.json())
                .then(data => {

                    updateCameraDisplay(data.on);

                })
                .catch(error => {

                    console.log("Erreur état caméra :", error);

                });
        }
       function updateCameraDisplay(cameraOn) {

    const offMessage = document.getElementById("cameraOffMessage");
    const video = document.getElementById("mainLiveVideo");
    const liveBadge = document.getElementById("liveBadge");

    if (!offMessage || !video || !liveBadge) {
        return;
    }

    if (cameraOn) {

        // =========================
        // CAMERA ON
        // =========================

        offMessage.style.display = "none";

        video.style.display = "block";

        liveBadge.style.display = "block";

        video.play().catch(error => {
            console.log("Erreur lecture vidéo :", error);
        });

    } else {

        // =========================
        // CAMERA OFF
        // =========================

        video.pause();

        video.style.display = "none";

        offMessage.style.display = "flex";

        liveBadge.style.display = "none";
    }
}
        // Extrait STATUS=1 à STATUS=6 d'une trame telle que :
        // RX : [TM#001#146#50#TEMP=15;BAT=3.18;PRESS=1004;STATUS=3#88]
        function extractMissionStatus(frame) {
            const match = String(frame).match(/(?:^|[;#])STATUS\s*=\s*([1-6])(?=[;#]|$)/i);
            return match ? Number(match[1]) : null;
        }

        function updateTimeline(status) {
            const statusNumber = Number(status);
            if (!Number.isInteger(statusNumber) || statusNumber < 1 || statusNumber > 6) {
                return;
            }

            document.querySelectorAll(".item").forEach(item => {
                item.classList.remove("active");
            });

            // STATUS=1 → ON, 2 → Init, 3 → Deploy, 4 → Commi,
            // 5 → Mission, 6 → End. Les identifiants HTML commencent à 0.
            const current = document.getElementById("step-" + (statusNumber - 1));

            if (current) {
                current.classList.add("active");
            }
        }

        async function refreshMissionStatus() {
            try {
                const response = await fetch("/status");
                const text = await response.text();
                let data = text;

                try {
                    data = JSON.parse(text);
                } catch (_) {
                    // La réponse est déjà une trame texte RX.
                }

                const frames = typeof data === "object" && data !== null
                    ? [data.trame, data.raw, data.message, data.status]
                    : [data];

                const status = frames
                    .map(extractMissionStatus)
                    .find(value => value !== null)
                    ?? (Number.isInteger(Number(data?.status)) ? Number(data.status) : null);

                updateTimeline(status);
            } catch (error) {
                console.warn("Impossible de récupérer le statut de mission :", error);
            }
        }

        refreshMissionStatus();
        setInterval(refreshMissionStatus, 2000);

        function captureImage() {
            const button = document.getElementById("captureButton");
            const status = document.getElementById("captureStatus");
            const image = document.getElementById("capturedImage");

            button.disabled = true;
            status.textContent = "Capture en cours...";

            fetch("/capture")
                .then(response => response.json())
                .then(data => {
                    button.disabled = false;

                    if (data.saved_image) {
                        const imageUrl = data.image_url || `/static/img/esp32/${data.saved_image}`;
                        image.src = imageUrl;
                        image.style.display = "block";
                        showInMainArea(imageUrl);
                        status.textContent = `Image récupérée et enregistrée. ESP32=${data.ip || 'inconnue'}`;
                    } else {
                        const errorDetail = data.error ? ` (${data.error})` : '';
                        const urls = data.attempted_urls ? ` Tentatives: ${data.attempted_urls.join(', ')}` : '';
                        status.textContent = `${data.message || 'Aucune image reçue.'}${errorDetail}${urls}`;
                    }
                })
                .catch(error => {
                    button.disabled = false;
                    status.textContent = `Erreur lors de la capture: ${error.message || error}`;
                    console.error("Capture error:", error);
                });
        }

        function loadEsp32Ip() {
            fetch('/esp32_ip')
                .then(response => response.json())
                .then(data => {
                    const input = document.getElementById('esp32IpInput');
                    if (input && data.ip) {
                        input.value = data.ip;
                    }
                })
                .catch(err => console.warn('Impossible de charger l IP ESP32', err));
        }

        function saveEsp32Ip() {
            const input = document.getElementById('esp32IpInput');
            const status = document.getElementById('captureStatus');
            if (!input) return;

            const ip = input.value.trim();
            if (!ip) {
                status.textContent = 'Saisissez une IP ESP32 valide.';
                return;
            }

            fetch('/esp32_ip', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ip })
            })
                .then(response => response.json())
                .then(data => {
                    status.textContent = data.message || 'IP enregistrée.';
                })
                .catch(err => {
                    status.textContent = 'Erreur lors de l enregistrement de l IP.';
                    console.error('ESP32 IP save error:', err);
                });
        }

        function showInMainArea(src) {
            if (!src) return;
            const mainImg = document.getElementById('mainCapturedImage');
            const video = document.getElementById('mainLiveVideo');
            if (mainImg && video) {
                mainImg.src = src;
                mainImg.style.display = 'block';
                video.style.display = 'none';
            }
        }

        function hideMainImage() {
            const mainImg = document.getElementById('mainCapturedImage');
            const video = document.getElementById('mainLiveVideo');
            if (mainImg && video) {
                mainImg.style.display = 'none';
                video.style.display = '';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (document.body.dataset.esp32Available === 'true') {
                loadEsp32Ip();
            }
        });



        function addTerminalLine(command, response, status, color = "#00ff00") {

            let terminal = document.getElementById("terminal");

            let now = new Date();
            let time = now.toLocaleTimeString('fr-FR');

            terminal.innerHTML = `
<div style="font-family:monospace; line-height:1.2; margin:0; padding:5px;">

<div><b>Cmd:</b> ${command} <span style="float:right;">${time}</span></div>

<div><b>Rep:</b> ${response}</div>

<div><b>Stat:</b> ${status}</div>

<hr style="border:0;border-top:1px solid #333;margin:4px 0;">

</div>
`;

        }

        async function toggleCamera(el) {
            if (el.checked) {
                const ok = await cameraOn();
                if (!ok) el.checked = false; // rollback si erreur
            } else {
                const ok = await camOff();
                if (!ok) el.checked = true; // rollback si erreur
            }

            updateCameraColor();
        }

        // test 3

        function addHistoryLog(type, message) {

            let container = document.getElementById("logsContainer");

            let now = new Date();
            let time = now.toLocaleTimeString('fr-FR');

            let badgeColor = "#1e90ff";

            if (type === "CMD")
                badgeColor = "#7b5cff";

            if (type === "WARN")
                badgeColor = "#f1c40f";

            if (type === "ERROR")
                badgeColor = "red";

            container.innerHTML += `
        <div style="display:flex;align-items:center;margin-bottom:6px;">

            <span style="width:80px;color:#b0b0b0;font-size:12px;">
                ${time}
            </span>

            <span style="
                background:${badgeColor};
                color:white;
                padding:2px 6px;
                border-radius:3px;
                font-size:10px;
                margin-right:8px;
            ">
                ${type}
            </span>

            <span style="color:#cfd8dc;">
                ${message}
            </span>

        </div>
    `;

            container.scrollTop = container.scrollHeight;
        }


        // Envoie une commande générique par son identifiant (défini dans satellites.json) au satellite actif
        async function sendCommand(id) {
            try {
                const response = await fetch('/send_command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                const data = await response.json();

                if (data.error) {
                    addTerminalLine(id, data.error, "FAIL");
                    addHistoryLog("ERROR", `${id} - FAIL`);
                    return false;
                }

                addTerminalLine(id, data.trame, "SUCCESS");
                addHistoryLog("CMD", `Commande ${id} envoyée`);
                return true;

            } catch (error) {
                addTerminalLine(id, "Erreur réseau", "FAIL");
                addHistoryLog("ERROR", `${id} - FAIL`);
                return false;
            }
        }

        async function cameraOn() {
            return cameraToggle ? sendCommand(cameraToggle.on_id) : false;
        }
        async function camOff() {
            return cameraToggle ? sendCommand(cameraToggle.off_id) : false;
        }
